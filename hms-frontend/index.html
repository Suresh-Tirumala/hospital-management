<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MediCore Hospital Management System" />
    <title>MediCore HMS — Hospital Management System</title>
    <style>
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; }
      #root { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
      .initial-loader { text-align: center; color: #5d5cfb; }
      .spinner { width: 48px; height: 48px; border: 4px solid #e2e8f0; border-top-color: #5d5cfb; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      h1 { font-size: 28px; color: #1e293b; margin: 0 0 8px 0; }
      p { color: #64748b; margin: 0; }
    </style>
    <script>
      if (global === undefined) { var global = window; }
    </script>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader">
        <div class="spinner"></div>
        <h1>MediCore HMS</h1>
        <p>Loading...</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
