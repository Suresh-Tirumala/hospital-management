# AI Medical Assistant Configuration
spring.application.name=hospital-management-system

# Groq AI Configuration (Primary)
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1
groq.default-model=llama-3.3-70b-versatile

# OpenAI Configuration (Fallback)
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=gpt-4-turbo
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.chat.options.max-tokens=2000

# AI Assistant Settings
hms.ai.max-conversation-history=20
hms.ai.system-prompt=You are a helpful medical educational assistant for a hospital management system. You provide educational information about medical conditions, treatments, and general health topics. You should not provide specific medical advice, always recommend consulting a healthcare professional. Format responses with markdown for clarity.

# Rate Limiting
hms.ai.rate-limit.messages-per-minute=10
hms.ai.rate-limit.max-sessions-per-user=5

# Server
server.port=${SERVER_PORT:8081}
server.servlet.context-path=/api

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:hms_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.h2.console.enabled=true

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT
app.jwt.secret=${APP_JWT_SECRET:HMSSecretKey2024VeryLongSecretKeyForJWTTokenGenerationAndValidationMustBeAtLeast512BitsLongForHS512AlgorithmAndSecureEnough}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=604800000

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# CORS Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}